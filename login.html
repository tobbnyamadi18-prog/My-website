<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPUSPRO | Log In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

    <main class="auth-wrapper">
        <section class="auth-card">

            <div class="logo auth-logo">
                <i class="fa-solid fa-graduation-cap"></i><span>CAMPUS<b>PRO</b></span>
            </div>

            <h1>Welcome back</h1>
            <p class="auth-sub">Log in to access your student dashboard.</p>

            <form class="auth-form" id="loginForm">

                <label for="loginEmail">Email address</label>
                <input type="email" id="loginEmail" placeholder="you@university.edu" autocomplete="email" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>

                <div class="auth-row">
                    <label class="check"><input type="checkbox" id="remember"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>

                <p class="form-message" id="loginMessage"></p>

                <button type="button" class="btn" id="loginBtn">Log In</button>

            </form>

            <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="login.js"></script>
</body>
</html>
